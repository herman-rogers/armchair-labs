# Reproducible v2 metric backtest configuration.
#
# Each forecast is built only from the preceding `history_seasons` seasons. Completed
# forecast seasons are scored against actual league-scored results; a future season is
# retained as a pending prospective forecast. Add or remove metric entries here to
# change the report without changing the analysis engine.
title: V2 Metric Report
# Player stats and play-by-play inputs begin in 2001. With a three-season history,
# 2004 is the first uniform forecast. The final season remains prospective.
forecast_start: 2004
forecast_end: 2026
history_seasons: 3
depth_chart_cutoff: "08-31"
depth_chart_start_season: 2004
minimum_sample: 20
baseline_metric: historical_ppg_prior

# Every result is calculated independently in each window. This keeps a large sample
# available for stability checks without pretending the 2004 NFL is the 2026 NFL.
analysis_windows:
  - {key: long_horizon, label: Long horizon, start: 2004, end: 2025}
  - {key: modern, label: Modern enriched, start: 2019, end: 2025}
  - {key: recent, label: Recent era, start: 2020, end: 2025}
  - {key: market, label: Market archive, start: 2021, end: 2025}
  # The Wayback/offense-page backfill extends dated ECR to 2011 (see
  # data/static/market_ecr_backfill.csv); the original archive window above is kept
  # so new reports stay comparable with every number in docs/v2_metrics_review.md.
  - {key: market_full, label: Market incl. backfill, start: 2011, end: 2025}

# The question the whole report exists to answer: in each backtested year, did our
# ranking put the players who actually finished best at the top, and did it do so
# better than the model-free baselines? Baselines are rankings anyone could produce
# from past production alone; candidates are the model outputs. Each is evaluated on
# the same top-K slice per position (the starters a ten-team league drafts) and on a
# draftable pool, so the score reflects the top of the board rather than the ability
# to separate starters from players who leave the league.
ranking:
  # Target-matched: the season-points outcome is also compared against last season's
  # points, the model-free ranking anyone would use for that outcome.
  baselines:
    default: [historical_ppg_prior, ppg, market_ecr_score]
    actual_season_points: [historical_ppg_prior, ppg, season_pts, market_ecr_score]
  candidates: [fitted_nextgen_ppg, fitted_nextgen_season_points, fitted_market_availability_returner_season_points, fitted_ppg, fitted_season_points, fitted_season_points_direct, fitted_two_stage, fitted_market_ppg, fitted_market_season_points, fitted_core_plus_ppg, fitted_core_plus_season_points, fitted_research_ppg, fitted_research_season_points, fitted_soph_ppg, fitted_soph_season_points, fitted_rostered_season_points, fitted_status_season_points, fitted_roster_ppg, fitted_roster_season_points, fitted_career_ppg, fitted_career_season_points, fitted_athletic_ppg, fitted_athletic_season_points, fitted_security_ppg, fitted_role_security_season_points, fitted_additive_ppg, fitted_additive_season_points, fitted_full_stack_season_points, fitted_rich_weekly_ppg, fitted_rich_weekly_games, fitted_rich_weekly_season_points, fitted_rich_weekly_direct, fitted_rich_weekly_combined, fitted_adaptive_ppg_hybrid, fitted_adaptive_season_hybrid, proj_ppg, prior_branch_ppg, component_proj_ppg]
  targets: [actual_season_points, actual_ppg]
  # Every candidate is also scored head-to-head against this ranker on the folds it
  # covers (the market's own seasons), reported as the `market_*` fields.
  market_baseline: market_ecr_score
  # FantasyPros overall ECR is a dated cross-position market-price proxy. It is kept
  # distinct from observed ADP; the disagreement report uses only common player rows.
  market_price_ranker: market_overall_ecr_score
  disagreement_round_size: 10
  disagreement_rounds: 2
  # Primary promotion evidence: among model top-60 players ECR priced outside the
  # tier, measure actual top-60 precision and how many of ECR's misses we recovered.
  # Deeper gaps isolate the true model-60 / market-300 style calls.
  value_capture_rank_gaps: [0, 20, 60, 120]
  top_k: {QB: 12, RB: 24, WR: 36, TE: 12}
  pool: {QB: 24, RB: 60, WR: 80, TE: 24}
  # Cross-position draft value. Each ranker becomes per-game VOR against its own
  # positional replacement (season-scale keys divided by 17, as the live board does),
  # then one top-K across every position is scored against availability-adjusted
  # actual VOR. This is the test the overall board order has to pass.
  overall:
    k: 60
    pool: 120
    target: actual_availability_value
    replacement_ranks: {QB: 12, RB: 25, WR: 35, TE: 12}
    min_games: 8
    season_games: 17

# Walk-forward fitted rankers. For each forecast season a per-position ridge
# regression is fitted on every completed fold strictly before it, with the ridge
# strength chosen by nested walk-forward validation on the last training seasons; the
# fitted outputs then compete in the ranking table above. Learned weights and their
# spread across refits are reported so that a weight that flips from year to year is
# visible. `product` models multiply earlier outputs, so availability is modelled
# once rather than fed into the per-game fit and multiplied in again.
fit:
  min_train_folds: 3
  min_position_rows: 40
  per_position: true
  inner_validation_folds: 3
  models:
    - name: candidate_games_nonredundant
      population: returner
      target: actual_games
      features: [expected_games, games, age_factor, historical_ppg_prior, depth_role_factor]
      absent_as_zero: true
      clip: [0, 17]
      apply_live: false
    # Per-active-game PPG. No availability input: that belongs to the games models.
    - name: fitted_ppg
      population: returner
      target: actual_ppg
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg]
      lambda_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0]
    # Calibrated games on the full population (absent players count as zero games).
    - name: fitted_games
      population: returner
      target: actual_games
      features: [expected_games, projected_availability, games, age_factor, historical_ppg_prior, depth_role_factor]
      absent_as_zero: true
      clip: [0, 17]
    # (a) PPG x calibrated availability.
    - name: fitted_season_points
      population: returner
      kind: product
      factors: [fitted_ppg, fitted_games]
    # (b) Season points fitted directly, absent players scored as zero.
    - name: fitted_season_points_direct
      population: all
      target: actual_season_points
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg, expected_games, season_pts]
      absent_as_zero: true
      clip: [0, null]
    # (c) Two-stage: P(appears) x games given appearance x PPG.
    - name: fitted_return_prob
      population: all
      target: actual_played
      features: [expected_games, projected_availability, games, age_factor, historical_ppg_prior, depth_role_factor]
      absent_as_zero: true
      clip: [0, 1]
    - name: fitted_games_if_played
      population: all
      target: actual_games
      features: [expected_games, projected_availability, games, age_factor, historical_ppg_prior, depth_role_factor]
      played_only: true
      clip: [1, 17]
    - name: fitted_two_stage
      population: all
      kind: product
      factors: [fitted_return_prob, fitted_games_if_played, fitted_ppg]
    # Staged report-only challengers make each research family independently
    # falsifiable before the surviving signals are combined.
    # ---- Experimental candidates (apply_live: false). None of these touches the live
    # board; they compete in the ranking table and, where the market baseline covers
    # their folds, are scored directly against FantasyPros ECR.
    #
    # Market-informed: the crowd's preseason rank as a feature. ECR exists from 2021,
    # so this model trains only on rows that carry it and scores 2023+ (two prior
    # folds minimum), reported with its own fold count.
    - name: fitted_market_ppg
      population: all
      target: actual_ppg
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg, market_ecr_score, market_ecr_sd]
      require_features: [market_ecr_score]
      min_train_folds: 2
      lambda_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0]
      apply_live: false
    - name: fitted_market_season_points
      population: all
      kind: product
      factors: [fitted_market_ppg, fitted_games]
      apply_live: false
    # Core plus the survivors of the qb-process / team-tendency research models
    # (scrambles, designed carries, neutral EPA, xFP). The NGS and opportunity models
    # were retired: no lift anywhere, small unstable weights, sparse coverage.
    - name: fitted_core_plus_ppg
      population: all
      target: actual_ppg
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg, scramble_carries, designed_carries, neutral_epa_per_play, xfp_pg]
      lambda_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0]
      apply_live: false
    - name: fitted_core_plus_season_points
      population: all
      kind: product
      factors: [fitted_core_plus_ppg, fitted_games]
      apply_live: false
    # Research subset retained: the only candidate with a TE signal (xFP).
    - name: fitted_research_ppg
      population: all
      target: actual_ppg
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg, xfp_pg, scramble_carries, neutral_pass_oe, ngs_yac_oe, ngs_ryoe_per_att]
      lambda_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0]
      apply_live: false
    - name: fitted_research_season_points
      population: all
      kind: product
      factors: [fitted_research_ppg, fitted_games]
      apply_live: false
    # Career-phase: the 2026-08-30 aging study found the year-two leap is the one
    # career phase the core features miss — next-season PPG ran ~+2.7 above
    # fitted_ppg for players entering their second season (+3.3 when the production
    # leans on rushing). The dummy and its rushing-reliance interaction let the
    # ridge price the sophomore leap; report-only until it wins.
    - name: fitted_soph_ppg
      population: all
      target: actual_ppg
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg, entering_sophomore, sophomore_rush_share]
      apply_live: false
    - name: fitted_soph_season_points
      population: all
      kind: product
      factors: [fitted_soph_ppg, fitted_games]
      apply_live: false
    # Additive structural stacks. Canonical roster fields are reconstructed only from
    # dated transactions through the August cutoff; every model remains report-only
    # until it wins both the modern and long windows and the market comparison.
    - name: fitted_rostered_games
      population: all
      target: actual_games
      features: [expected_games, games, age_factor, historical_ppg_prior, depth_role_factor, preseason_rostered, team_changed]
      absent_as_zero: true
      clip: [0, 17]
      apply_live: false
    - name: fitted_rostered_season_points
      population: all
      kind: product
      factors: [fitted_ppg, fitted_rostered_games]
      apply_live: false
    - name: fitted_status_games
      population: all
      target: actual_games
      features: [expected_games, games, age_factor, historical_ppg_prior, depth_role_factor, preseason_status_score, preseason_reserve, team_changed]
      absent_as_zero: true
      clip: [0, 17]
      apply_live: false
    - name: fitted_status_season_points
      population: all
      kind: product
      factors: [fitted_ppg, fitted_status_games]
      apply_live: false
    - name: fitted_roster_ppg
      population: all
      target: actual_ppg
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg, preseason_status_score, preseason_reserve, team_changed, player_experience]
      apply_live: false
    - name: fitted_roster_season_points
      population: all
      kind: product
      factors: [fitted_roster_ppg, fitted_status_games]
      apply_live: false
    # Next-generation challenger: quality and availability stay separate, the
    # availability feature set contains expected_games only once, and rookies are
    # trained as their own population rather than mean-imputed returners. The first
    # rookie scorecard rejected age/combine/college context, leaving NFL draft capital
    # plus an undrafted indicator as the lean core. Everything remains shadow-only
    # until the prospective and market-disagreement gates pass.
    - name: fitted_nextgen_returner_ppg
      population: returner
      target: actual_ppg
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg]
      require_features: [returning_indicator]
      apply_live: false
    - name: fitted_nextgen_returner_games
      population: returner
      target: actual_games
      features: [expected_games, games, age_factor, historical_ppg_prior, depth_role_factor, preseason_status_score, preseason_reserve, cutoff_injured_reserve, cutoff_pup_nfi, cutoff_suspended, cutoff_reserve_other, cutoff_recent_event_score, team_changed]
      require_features: [returning_indicator]
      absent_as_zero: true
      clip: [0, 17]
      apply_live: false
    - name: fitted_nextgen_returner_season_points
      population: all
      kind: product
      factors: [fitted_nextgen_returner_ppg, fitted_nextgen_returner_games]
      apply_live: false
    - name: fitted_nextgen_rookie_ppg
      population: rookie
      target: actual_ppg
      features: [rookie_draft_capital_score, rookie_was_drafted]
      require_features: [rookie_indicator]
      apply_live: false
    - name: fitted_nextgen_rookie_games
      population: rookie
      target: actual_games
      features: [rookie_draft_capital_score, rookie_was_drafted]
      require_features: [rookie_indicator]
      absent_as_zero: true
      clip: [0, 17]
      apply_live: false
    - name: fitted_nextgen_rookie_season_points
      population: all
      kind: product
      factors: [fitted_nextgen_rookie_ppg, fitted_nextgen_rookie_games]
      apply_live: false
    - name: fitted_nextgen_ppg
      population: all
      kind: coalesce
      factors: [fitted_nextgen_rookie_ppg, fitted_nextgen_returner_ppg]
      apply_live: false
    - name: fitted_nextgen_season_points
      population: all
      kind: coalesce
      factors: [fitted_nextgen_rookie_season_points, fitted_nextgen_returner_season_points]
      apply_live: false
    # Same-timestamp hybrid: the structured transaction model above handles known
    # reserve mechanisms; dated ECR is added only to the games leg as the observable
    # carrier for soft injuries/recovery news absent from the public historical feed.
    # This is evaluated as a market-conditioned challenger, not independent alpha.
    - name: fitted_market_availability_games
      population: returner
      target: actual_games
      features: [expected_games, games, age_factor, historical_ppg_prior, depth_role_factor, preseason_status_score, preseason_reserve, cutoff_injured_reserve, cutoff_pup_nfi, cutoff_suspended, cutoff_reserve_other, cutoff_recent_event_score, team_changed, market_ecr_score, market_ecr_sd, market_overall_ecr_score]
      require_features: [returning_indicator, market_ecr_score, market_overall_ecr_score]
      min_train_folds: 2
      absent_as_zero: true
      clip: [0, 17]
      apply_live: false
    - name: fitted_market_availability_returner_season_points
      population: all
      kind: product
      factors: [fitted_nextgen_returner_ppg, fitted_market_availability_games]
      apply_live: false
    - name: fitted_market_availability_season_points
      population: all
      kind: coalesce
      factors: [fitted_nextgen_rookie_season_points, fitted_market_availability_returner_season_points]
      apply_live: false
    # 2026-08-31 focus round: the snap-trend, standalone-vacated, capital/commitment,
    # hidden-residual, cutdown-stack, adaptive-blend, hard-coded position-hybrid, and
    # market-plus-everything specs were deleted — each was explicitly rejected by the
    # review (§12/§13) and none is a factor of the frozen adaptive selectors. Their
    # feature columns remain available for future hypotheses.
    # Residual-discovery round. Broad career phase/workload, combine athleticism, and
    # depth/contract/opportunity security are kept in separate lean stages before any
    # stack is allowed to combine them.
    - name: fitted_career_ppg
      population: all
      target: actual_ppg
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg, early_career_score, source_opportunities_pg, source_opportunities_pg_sq, career_opportunities_log, career_pass_attempts_log]
      lambda_grid: [0.03, 0.1, 0.3, 1.0, 3.0]
      apply_live: false
    - name: fitted_career_season_points
      population: all
      kind: product
      factors: [fitted_career_ppg, fitted_games]
      apply_live: false
    - name: fitted_athletic_ppg
      population: all
      target: actual_ppg
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg, entering_sophomore, sophomore_rush_share, early_career_score, combine_speed_score, combine_burst_score, young_speed_score, young_burst_score]
      lambda_grid: [0.03, 0.1, 0.3, 1.0, 3.0]
      apply_live: false
    - name: fitted_athletic_season_points
      population: all
      kind: product
      factors: [fitted_athletic_ppg, fitted_games]
      apply_live: false
    # fitted_security_ppg survives only as a factor of the role-security product,
    # which the frozen full-stack selector feature list depends on.
    - name: fitted_security_ppg
      population: all
      target: actual_ppg
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg, early_career_score, contract_years_remaining, contract_depth_security, draft_capital_score, vacated_target_opportunity, vacated_carry_opportunity, vacated_target_early_career, vacated_carry_early_career]
      lambda_grid: [0.03, 0.1, 0.3, 1.0, 3.0]
      apply_live: false
    - name: fitted_role_security_games
      population: all
      target: actual_games
      features: [expected_games, games, age_factor, historical_ppg_prior, depth_role_factor, preseason_rostered, team_changed, early_career_score, source_opportunities_pg, source_opportunities_pg_sq, career_opportunities_log, career_pass_attempts_log, contract_depth_security, vacated_target_opportunity, vacated_carry_opportunity]
      absent_as_zero: true
      clip: [0, 17]
      lambda_grid: [0.03, 0.1, 0.3, 1.0, 3.0]
      apply_live: false
    - name: fitted_role_security_season_points
      population: all
      kind: product
      factors: [fitted_security_ppg, fitted_role_security_games]
      apply_live: false
    - name: fitted_additive_ppg
      population: all
      target: actual_ppg
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg, preseason_status_score, preseason_reserve, team_changed, player_experience, source_offense_snap_pct, offense_snap_pct_trend, team_vacated_target_share, team_vacated_carry_share, vacated_target_opportunity, vacated_carry_opportunity, draft_capital_score, was_drafted, contract_apy_cap_pct, contract_guaranteed_log, contract_years_remaining]
      apply_live: false
    - name: fitted_additive_games
      population: all
      target: actual_games
      features: [expected_games, games, age_factor, historical_ppg_prior, depth_role_factor, preseason_status_score, preseason_reserve, team_changed, player_experience, source_offense_snap_pct, offense_snap_pct_trend, draft_capital_score, was_drafted, contract_apy_cap_pct, contract_guaranteed_log, contract_years_remaining]
      absent_as_zero: true
      clip: [0, 17]
      apply_live: false
    - name: fitted_additive_season_points
      population: all
      kind: product
      factors: [fitted_additive_ppg, fitted_additive_games]
      apply_live: false
    # Honest stacked generalization: historical component forecasts are out-of-fold,
    # so each meta fit sees only predictions produced without that season's outcome.
    # Stronger ridge grids reflect the high collinearity among component forecasts.
    # Frozen: this spec is a factor of the 2026 adaptive selectors — do not rename,
    # reorder its features, or delete it before grade-prospective runs.
    - name: fitted_full_stack_season_points
      population: all
      target: actual_season_points
      features: [fitted_season_points, fitted_rostered_season_points, fitted_status_season_points, fitted_roster_season_points, fitted_additive_season_points, fitted_soph_season_points, fitted_career_season_points, fitted_role_security_season_points]
      require_features: [fitted_season_points]
      absent_as_zero: true
      clip: [0, null]
      lambda_grid: [0.3, 1.0, 3.0, 10.0, 30.0]
      apply_live: false
    # Compact challenger distilled from the source-aware weekly discovery panel.
    # Quality and availability remain separate; the product preserves the season-point
    # scale required by the adaptive board and cross-position VOR ranking.
    - name: fitted_rich_weekly_ppg
      population: returner
      target: actual_ppg
      features: [historical_ppg_prior, ppg, age_factor, depth_role_factor, component_proj_ppg, rich_s0_points_last4, rich_s0_xfp_last4, rich_s0_expected_td_mean, rich_s0_snap_pct_mean, rich_s0_snap_pct_q75, rich_s0_route_participation_mean, rich_s0_route_participation_q75, rich_s0_targets_per_route_mean, rich_s0_targets_per_route_q75, rich_s0_targets_per_route_entropy, rich_s0_targets_per_route_zero_rate]
      require_features: [returning_indicator]
      lambda_grid: [0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
      apply_live: false
    - name: fitted_rich_weekly_games
      population: returner
      target: actual_games
      features: [expected_games, projected_availability, games, age_factor, historical_ppg_prior, depth_role_factor, rich_s0_points_coverage, rich_s0_snap_pct_mean, rich_s0_snap_pct_zero_rate, rich_s0_snap_pct_end_streak, rich_s0_roster_score_mean, rich_s0_roster_score_end_streak, rich_s0_injury_severity_mean, rich_s0_practice_limit_mean]
      require_features: [returning_indicator]
      absent_as_zero: true
      clip: [0, 17]
      lambda_grid: [0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
      apply_live: false
    - name: fitted_rich_weekly_season_points
      population: all
      kind: product
      factors: [fitted_rich_weekly_ppg, fitted_rich_weekly_games]
      apply_live: false
    - name: fitted_rich_weekly_direct
      population: returner
      target: actual_season_points
      features: [ppg, season_pts, games, age_at_season]
      feature_prefixes: [rich_]
      max_features: 64
      require_features: [returning_indicator]
      absent_as_zero: true
      clip: [0, null]
      lambda_grid: [1.0, 10.0, 100.0]
      min_train_folds: 5
      apply_live: false
    - name: fitted_rich_weekly_combined
      population: all
      kind: coalesce
      factors: [fitted_nextgen_rookie_season_points, fitted_rich_weekly_direct]
      apply_live: false
    # Expanding-window selectors turn the position-hybrid clue into a genuine
    # walk-forward test. For forecast S, each position chooses the component with
    # the best mean top-K result through S-1. Candidate order makes the incumbent
    # win exact ties. These remain report-only and use no modern-era hard-coding.
    - name: fitted_adaptive_ppg_hybrid
      population: all
      kind: adaptive_select
      target: actual_ppg
      selection_metric: hit_rate
      selection_top_k: {QB: 12, RB: 24, WR: 36, TE: 12}
      factors: [fitted_season_points, fitted_two_stage, fitted_rostered_season_points, fitted_athletic_season_points, fitted_additive_season_points, fitted_full_stack_season_points]
      fallback: fitted_two_stage
      apply_live: false
    - name: fitted_adaptive_season_hybrid
      population: all
      kind: adaptive_select
      target: actual_season_points
      selection_metric: ndcg
      selection_top_k: {QB: 12, RB: 24, WR: 36, TE: 12}
      factors: [fitted_season_points, fitted_two_stage, fitted_rostered_season_points, fitted_athletic_season_points, fitted_additive_season_points, fitted_full_stack_season_points]
      fallback: fitted_two_stage
      apply_live: false
    # A nested OOF stack of fitted_rich_weekly_combined plus the incumbent Adaptive
    # forecast was tested on 2026-08-31 and rejected after losing both modern TE PPG
    # hit rate and modern TE season NDCG. Keep the raw rich candidates visible in the
    # report, but do not burden the selector or live board with a failed blend.

targets:
  - key: actual_ppg
    label: Next-season PPG
    description: League-scored points per active game in the forecast season.
    missing_as_zero: false
  - key: actual_vor
    label: Next-season VOR
    description: Actual PPG above that season's positional replacement level.
    missing_as_zero: false
  - key: actual_availability_value
    label: Availability-adjusted VOR
    description: Positive actual VOR scaled by active games; absent players count as zero value.
    missing_as_zero: true
  - key: actual_games
    label: Games played
    description: Games with offensive participation in the forecast season; absent players count as zero.
