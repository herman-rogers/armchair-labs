[project]
name = "armchair-engine"
version = "0.1.0"
description = "Armchair Labs data, statistics, forecasting, and fantasy analysis engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.44.1",
    "pyarrow>=18.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "typer>=0.15.0",
    "pyyaml>=6.0.2",
    "playwright>=1.62.0",
    "espn-api>=0.46.0",
    "requests>=2.34.2",
    "types-requests>=2.33.0.20260712",
    "numpy>=2.2,<3",
    "scikit-learn>=1.7.2",
    "duckdb>=1.4,<2",
]

[project.scripts]
engine = "engine.cli:app"

[project.optional-dependencies]
shared-data = [
    "google-cloud-storage>=3.0,<4",
]
research = [
    "xgboost==3.4.1",
    "catboost==1.2.10",
    "lightgbm==4.7.0",
]
# NVIDIA RAPIDS wheels are optional and Linux-only; base installs remain portable.
# CUDA 13.3 matches the tested RTX 4090 driver; NumPy is constrained transitively
# by RAPIDS' supported Numba version. Do not install with --no-deps.
research-gpu = [
    "cuml-cu13==26.8.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.15'",
    "cuda-toolkit==13.3.*; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.15'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-pyyaml>=6.0.12",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are opt-in: the default suite must run offline and fast.
# Run them with `pytest -m network` or `just test-all`.
addopts = "-q --strict-markers -m 'not network'"
markers = [
    "network: test hits the live nflverse API (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# docs/ holds the original draft-prep script, kept verbatim as the reference this
# port was built from. Reformatting it would obscure the comparison.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["engine"]
mypy_path = "src"
ignore_missing_imports = true
