[project]
name = "patron"
version = "0.1.0"
description = "Patron Saints analytics engine — league-exact fantasy valuation for Sweaty Plays"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.44.1",
    "pyarrow>=18.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "typer>=0.15.0",
    "pyyaml>=6.0.2",
    "playwright>=1.62.0",
    "espn-api>=0.46.0",
    "requests>=2.34.2",
    "types-requests>=2.33.0.20260712",
    "numpy>=2.5.2",
    "scikit-learn>=1.7.2",
]

[project.scripts]
patron = "patron.cli:app"

[project.optional-dependencies]
shared-data = [
    "google-cloud-storage>=3.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are opt-in: the default suite must run offline and fast.
# Run them with `pytest -m network` or `just test-all`.
addopts = "-q --strict-markers -m 'not network'"
markers = [
    "network: test hits the live nflverse API (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# docs/ holds the original draft-prep script, kept verbatim as the reference this
# port was built from. Reformatting it would obscure the comparison.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["patron"]
mypy_path = "src"
ignore_missing_imports = true
